name: eqasim

channels:
  - conda-forge

dependencies:
  - python=3.7

  # Core (ajustado)
  - numpy=1.21
  - pandas=1.3
  - scipy=1.7
  - matplotlib=3.5

  # Geo stack consistente
  - geopandas=0.9
  - shapely=1.7.1
  - fiona=1.8.20
  - gdal=3.2
  - pyproj=3.2
  - proj
  - proj-data
  - libtiff

  # ML / utils
  - scikit-learn=0.24
  - numba=0.53
  - tqdm
  - pytables
  - xlrd
  - palettable

  - pip
  - pip:
      - synpp==1.2.2
      - pyreadstat==0.3.4
      - simpledbf==0.2.6
      - osmium==3.0.0
      - gtfsmerger==0.1.6
